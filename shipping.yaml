openapi: 3.0.0
info:
  title: Package Management API
  version: 1.0.0
  description: API for managing packages, including creation, retrieval, updating, and deletion.
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080/api/v1 # Replace with your actual server URL
    description: Development server

paths:
  /packages:
    get:
      summary: Get all packages
      description: Retrieve a list of all packages.
      operationId: getAllPackages
      tags:
        - Packages
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new package
      description: Create a new package with the provided details.
      operationId: createPackage
      tags:
        - Packages
      requestBody:
        description: Package object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageCreateRequest'
      responses:
        '201':
          description: Package created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /packages/{packageId}:
    get:
      summary: Get package by ID
      description: Retrieve a package by its unique identifier.
      operationId: getPackageById
      tags:
        - Packages
      parameters:
        - name: packageId
          in: path
          description: ID of the package to retrieve
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '404':
          description: Package not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update package by ID
      description: Update an existing package by its unique identifier.
      operationId: updatePackageById
      tags:
        - Packages
      parameters:
        - name: packageId
          in: path
          description: ID of the package to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Package object that needs to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageUpdateRequest'
      responses:
        '200':
          description: Package updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Package not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete package by ID
      description: Delete a package by its unique identifier.
      operationId: deletePackageById
      tags:
        - Packages
      parameters:
        - name: packageId
          in: path
          description: ID of the package to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Package deleted
        '404':
          description: Package not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Package:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the package
          readOnly: true
        height:
          type: number
          format: float
          description: Height of the package in cm
        width:
          type: number
          format: float
          description: Width of the package in cm
        depth:
          type: number
          format: float
          description: Depth of the package in cm
        weight:
          type: number
          format: float
          description: Weight of the package in kg
        special_handling_instructions:
          type: string
          description: Any special handling instructions for the package

    PackageCreateRequest:
        type: object
        required:
          - height
          - width
          - depth
          - weight
        properties:
            height:
              type: number
              format: float
              description: Height of the package in cm
            width:
              type: number
              format: float
              description: Width of the package in cm
            depth:
              type: number
              format: float
              description: Depth of the package in cm
            weight:
              type: number
              format: float
              description: Weight of the package in kg
            special_handling_instructions:
              type: string
              description: Any special handling instructions for the package

    PackageUpdateRequest:
      type: object
      properties:
        height:
          type: number
          format: float
          description: Height of the package in cm
        width:
          type: number
          format: float
          description: Width of the package in cm
        depth:
          type: number
          format: float
          description: Depth of the package in cm
        weight:
          type: number
          format: float
          description: Weight of the package in kg
        special_handling_instructions:
          type: string
          description: Any special handling instructions for the package

    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

